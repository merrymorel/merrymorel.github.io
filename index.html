<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0f2a1a" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<title>Our Arcade</title>
<style>
  :root{ --ink:#0a1f14; --jungle:#0f2a1a; --panel:rgba(15,42,26,.86); --cream:#fff4d6; --sun:#ffb347; --fern:#5ccf6a; --lagoon:#8fe3ff; --berry:#ff5f7a; --bark:#7a4b00; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; min-height:100%; background:radial-gradient(ellipse at 50% 0%, #1d4a2f, var(--jungle) 70%); color:var(--cream); font-family:"Arial Rounded MT Bold", ui-rounded, "Nunito", "Segoe UI", system-ui, sans-serif; user-select:none; -webkit-user-select:none; }
  .wrap{ max-width:720px; margin:0 auto; padding:max(24px, env(safe-area-inset-top)) 18px 40px; }
  h1{ text-align:center; margin:8px 0 2px; font-size:clamp(34px, 8vw, 56px); letter-spacing:3px; color:var(--sun); text-shadow:0 4px 0 var(--bark), 0 8px 18px rgba(0,0,0,.4); }
  .sub{ text-align:center; margin:0 0 22px; opacity:.85; font-weight:700; }
  .games{ display:grid; gap:16px; grid-template-columns:1fr; }
  @media (min-width:640px){ .games{ grid-template-columns:repeat(3,1fr); } }
  a.game{ display:flex; flex-direction:column; align-items:center; gap:10px; text-decoration:none; color:var(--cream); background:var(--panel); border:3px solid var(--ink); border-radius:22px; box-shadow:0 8px 0 #061510, 0 12px 26px rgba(0,0,0,.35); padding:22px 16px 18px; transition:transform .08s; }
  a.game:active{ transform:translateY(4px); box-shadow:0 4px 0 #061510; }
  .px{ image-rendering:pixelated; image-rendering:-webkit-crisp-edges; image-rendering:crisp-edges; }
  .game .nm{ font-size:22px; font-weight:900; letter-spacing:1px; }
  .game .tag{ font-size:13px; opacity:.85; text-align:center; }
  .game .btn{ margin-top:6px; padding:12px 26px; border-radius:16px; border:3px solid var(--ink); background:var(--fern); color:#06230d; font-weight:900; font-size:18px; box-shadow:0 5px 0 #061510; }
  .game.cats .btn{ background:var(--sun); color:#3a2300; } .game.moto .btn{ background:var(--lagoon); color:#0b2a3a; }
  .foot{ text-align:center; font-size:12px; opacity:.6; margin-top:28px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>OUR ARCADE</h1>
  <p class="sub">Pick a game 🕹️</p>
  <div class="games">
    <a class="game dino" href="./dino-island/"><canvas class="px" data-ico="rex" width="16" height="16"></canvas><div class="nm">Dino Island</div><div class="tag">Hatch a dinosaur, eat, grow, rescue eggs</div><div class="btn">Play</div></a>
    <a class="game cats" href="./big-cat-island/"><canvas class="px" data-ico="lion" width="16" height="16"></canvas><div class="nm">Big Cat Island</div><div class="tag">Wake up a cub, hunt, lead the pride</div><div class="btn">Play</div></a>
    <a class="game moto" href="./moto-stadium/"><canvas class="px" data-ico="bike" width="16" height="16"></canvas><div class="nm">Moto Stadium</div><div class="tag">Race, jump, whip, win</div><div class="btn">Play</div></a>
  </div>
  <p class="foot">Add this page to the Home Screen and every game is one tap away. Games save on this device.</p>
</div>
<script>
const PAL={"k": "#0a1f14", "g": "#2c8a58", "G": "#5ccf6a", "L": "#a8ec7c", "j": "#1a4a2a", "o": "#d8741f", "A": "#ffb347", "Y": "#ffe9a8", "r": "#b5305c", "R": "#ff5f7a", "P": "#ff9fb0", "b": "#2f6fbf", "B": "#8fe3ff", "C": "#dffaff", "d": "#5a3a3e", "D": "#8a5a3a", "T": "#d9b48a", "w": "#cbbfa8", "W": "#fff4d6", "X": "#ffffff", "s": "#4c5566", "S": "#8a96a8", "H": "#c6cfdc", "p": "#9d7bff"}; const PX={"rex": ["................", "........kkkkkk..", ".......kGLGGGGk.", ".......kGkGGGGGk", ".......kGGGGGGGk", ".......kGGkWkWkk", "..kk..kGGGkkkkk.", ".kGGkkGGGGGGkk..", ".kGGGGGGGGGGkkk.", "..kkGGGGGGGGGgk.", "....kGGGGGGGgk..", ".....kkGGkGgk...", "......kGGk.kGk..", "......kGGk.kGk..", ".....kkkkk.kkkk.", "................"], "lion": ["................", "........kkkkk...", ".......kDDDDDk..", "......kDkTTTkDk.", ".kk...kDkTkTkDk.", "kTTkkkkDTTTTTDk.", "kkTTTTTTkTTWTkk.", "..kTTTTTTkkkk...", "..kTTTTTTTTTk...", "..kTTTTTTTTTk...", "...kTkkTkkTk....", "...kTk.kTkTk....", "...kTk.kTkTk....", "...kTk.kTkTk....", "..kkkk.kkkkkk...", "................"], "bike": ["................", "........kkk.....", ".......kAAAk....", "..kk...kAAAAk...", "..kkk.kkkkkkk...", "...kkkAAAAAkk...", "...kkAAAAAAkkk..", "..kkkkkAAAkkkkk.", ".kSSSkkkkkkkSSSk", "kSkkSkksskkSkkSk", "kSk.kSkkkkkSk.kS", "kSkkSk.....kSkkS", ".kSSSk.....kSSSk", "..kkk.......kkk.", "................", "................"], "gamepad": ["................", "................", "................", "...kkkkkkkkkk...", "..kSSSSSSSSSSk..", ".kSSkkSSSSSSSSk.", ".kSkkkkSSSRSSSk.", ".kSSkkSSSAkkSSk.", ".kSSSSSSSSSSSSk.", "..kSSSSSSSSSSk..", "...kkkkkkkkkk...", "................", "................", "................", "................", "................"], "trophy": ["................", "..kkkkkkkkkkkk..", "..kAYAAAAAAAAk..", ".kkAYAAAAAAAAkk.", ".kAkAAAAAAAAkAk.", ".kAkAAAAAAAAkAk.", ".kkkAAAAAAAAkkk.", "...kAAAAAAAAk...", "....kAAAAAAk....", ".....kkAAkk.....", "......kAAk......", "......kAAk......", "....kkkAAkkk....", "...kDDDDDDDDk...", "...kkkkkkkkkk...", "................"]};
document.querySelectorAll('canvas[data-ico]').forEach(c=>{ const g=PX[c.dataset.ico]; const S=6; c.width=16*S; c.height=16*S; c.style.width='96px'; c.style.height='96px'; const x=c.getContext('2d'); for(let y=0;y<16;y++) for(let i=0;i<16;i++){ const ch=g[y][i]; if(ch==='.') continue; x.fillStyle=PAL[ch]; x.fillRect(i*S,y*S,S,S); } });
if('serviceWorker' in navigator && location.protocol==='https:'){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).catch(()=>{}); }); }
</script>
</body>
</html>
